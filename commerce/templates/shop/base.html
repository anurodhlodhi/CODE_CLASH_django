{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}FaultLine Shop{% endblock %}</title><link rel="stylesheet" href="{% static 'shop.css' %}"></head><body>
<header><div class="wrap bar"><a class="brand" href="{% url 'shop-catalogue' %}">FaultLine <span>Shop</span></a><nav aria-label="Customer navigation"><a href="{% url 'shop-catalogue' %}">Products</a><a href="{% url 'shop-cart' %}">Cart</a><a href="{% url 'shop-orders' %}">Orders</a>{% if user.is_authenticated and not user.is_staff %}<span>{{ user.email }}</span><form method="post" action="{% url 'shop-logout' %}">{% csrf_token %}<button>Sign out</button></form>{% else %}<a href="{% url 'shop-login' %}">Customer sign in</a>{% endif %}<a href="/admin/">Admin</a></nav></div></header>
<main class="wrap">{% block content %}{% endblock %}</main></body></html>
